services:
  - type: web
    name: safebill-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AUTH_PROVIDER
        value: supabase
      - key: AI_PROVIDER
        value: gemini
      - key: STORAGE_PROVIDER
        value: supabase
      - key: AWS_ONLY_MODE
        value: "false"
      - key: PRODUCT_IMAGE_GENERATION_ENABLED
        value: "false"
      - key: DYNAMODB_MIRROR_ENABLED
        value: "false"
      - key: DYNAMODB_READ_FALLBACK_ENABLED
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
